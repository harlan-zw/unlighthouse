name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag on v1
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/v1'
    runs-on: ubuntu-latest
    steps:
      - name: Select release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            dist_tag=beta
          elif [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            dist_tag=latest
          else
            echo 'Use a stable or beta release tag.' >&2
            exit 1
          fi
          {
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
            echo "dist_tag=$dist_tag"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release commit
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git merge-base --is-ancestor HEAD origin/v1
          for manifest in package.json packages/*/package.json; do
            if [[ "$manifest" != package.json ]] && jq -e '.private == true' "$manifest" >/dev/null; then
              continue
            fi
            jq -e --arg version "$RELEASE_VERSION" '.version == $version' "$manifest" >/dev/null
          done

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: v24
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test --run

      - name: Check package types
        run: pnpm test:attw

      - name: Check package exports
        run: pnpm test:publint

      - name: Install npm CLI
        run: npm install --global npm@12.2.2 --ignore-scripts

      - name: Publish packages with npm Trusted Publishing
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          for manifest in packages/*/package.json; do
            if jq -e '.private == true' "$manifest" >/dev/null; then
              continue
            fi
            package_dir="${manifest%/package.json}"
            package_name="$(jq -er '.name' "$manifest")"
            archive="$RUNNER_TEMP/${package_dir##*/}.tgz"
            pnpm --dir "$package_dir" pack --out "$archive" --silent

            versions="$(npm view "$package_name" versions --json --prefer-online)"
            if jq -e --arg version "$RELEASE_VERSION" 'index($version) != null' <<< "$versions" >/dev/null; then
              published_file="$(npm pack "$package_name@$RELEASE_VERSION" --ignore-scripts --json --pack-destination "$RUNNER_TEMP" | jq -er '.[0].filename')"
              expected="$(mktemp -d "$RUNNER_TEMP/current.XXXXXX")"
              published="$(mktemp -d "$RUNNER_TEMP/published.XXXXXX")"
              # pnpm pack can vary archive and dependency map order between runs.
              tar --extract --gzip --file "$archive" --directory "$expected"
              tar --extract --gzip --file "$RUNNER_TEMP/$published_file" --directory "$published"
              for unpacked in "$expected" "$published"; do
                jq 'with_entries(if (.key | IN("dependencies", "devDependencies", "optionalDependencies", "peerDependencies")) then .value |= (to_entries | sort_by(.key) | from_entries) else . end)' \
                  "$unpacked/package/package.json" > "$unpacked/manifest.json"
                mv "$unpacked/manifest.json" "$unpacked/package/package.json"
              done
              if ! diff -qr --no-dereference "$expected" "$published"; then
                echo "Published archive differs for $package_name@$RELEASE_VERSION" >&2
                exit 1
              fi
              continue
            fi

            npm publish "$archive" --access public --tag "$DIST_TAG" --provenance
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: |
          release_flags=(--verify-tag --generate-notes)
          if [[ "$DIST_TAG" == beta ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${release_flags[@]}"
