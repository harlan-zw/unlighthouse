name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            tag=beta
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tag=latest
          else
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/v1
          for manifest in package.json packages/*/package.json; do
            if [[ "$manifest" != package.json ]] && jq -e '.private == true' "$manifest" >/dev/null; then
              continue
            fi
            jq -e --arg version "$version" '.version == $version' "$manifest" >/dev/null
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: v24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Force Set pnpm Registry
        run: pnpm config set registry https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test --run

      - name: Check package types
        run: pnpm test:attw

      - name: Check package exports
        run: pnpm test:publint

      - name: Publish packages
        run: pnpm publish -r --access public --tag "${{ steps.release.outputs.tag }}" --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ${{ steps.release.outputs.tag == 'beta' && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
