name: Build Unlighthouse Demo

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Optional comma-separated paths for a focused mobile and desktop demo scan'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: v24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: PNPM build
        run: pnpm run build

      - name: Run Unlighthouse CI
        run: |
          if [ -n "$DEMO_URLS" ]; then
            pnpm ci:docs --urls "$DEMO_URLS" --disable-sitemap --device mobile,desktop
          else
            pnpm ci:docs
          fi
        env:
          DEMO_URLS: ${{ inputs.urls }}
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}

      - name: Locate static dashboard
        id: report
        run: node scripts/demo-report.ts

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v4.0
        with:
          publish-dir: ${{ steps.report.outputs.publish-dir }}
          production-branch: main
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: New Release Deploy from GitHub Actions
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_DEMO_SITE_ID }}
        timeout-minutes: 1
