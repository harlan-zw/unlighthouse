# Manual deploy of the maintained Cloudflare app (panel + API + Lighthouse
# container) to your own Cloudflare account — runs the Docker container-image
# build on the GitHub runner so you never need Docker locally.
#
# One-time setup (in the repo/fork you run this from):
#   Settings → Secrets and variables → Actions → New repository secret
#     CLOUDFLARE_API_TOKEN    # scope: Workers Scripts:Edit, D1:Edit, R2:Edit,
#                             #        Browser Rendering:Edit, Containers
#     CLOUDFLARE_ACCOUNT_ID   # your account id
#   And the Worker's own secrets must already be set once via:
#     wrangler secret put UNLIGHTHOUSE_API_TOKEN / SHARED_AUDIT_TOKEN /
#     CF_BROWSER_RUN_TOKEN          (these persist across deploys)
#     PSI_API_KEY and CRUX_API_KEY are optional.
#   Configure CF_ACCOUNT_ID, allowed origins, a custom-domain route, D1 id,
#   and R2 bucket in apps/cloudflare/wrangler.jsonc before running this job.
#
# Then: Actions → "Deploy Cloudflare" → Run workflow.

name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      containers:
        description: Build + roll out the Lighthouse container image (needs Docker on the runner)
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Docker is preinstalled on ubuntu-latest runners, so wrangler can build
    # and push the container image.
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Use Node.js v24
        uses: actions/setup-node@v5
        with:
          node-version: v24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the workspace packages used by the Worker and container runtime.
      - name: Build packages
        run: pnpm run build

      - name: Verify Cloudflare app types and workerd tests
        run: |
          pnpm --filter @unlighthouse/app-cloudflare run typecheck
          pnpm --filter @unlighthouse/app-cloudflare run test

      # Image preparation vendors the built workspace dependencies into the
      # Docker context. Keep it out of ordinary package builds.
      - name: Prepare Lighthouse container image
        if: inputs.containers
        run: pnpm --filter @unlighthouse/lighthouse-container prepare:image

      # Build the dashboard SPA with the same-origin API base (and no global
      # WS) so the bundled panel talks to the Worker, not localhost.
      - name: Build panel
        working-directory: apps/cloudflare
        run: pnpm run build:panel

      - name: Dry-run Worker bundle
        working-directory: apps/cloudflare
        run: pnpm run deploy:dry-run

      # Apply versioned D1 migrations before the Worker starts depending on
      # the new schema. The app never runs DDL in a request path.
      - name: Apply D1 migrations
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run db:migrate:remote

      - name: Deploy
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ inputs.containers }}" = "true" ]; then
            pnpm exec wrangler deploy
          else
            pnpm exec wrangler deploy --containers-rollout=none
          fi
