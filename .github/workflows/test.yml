name: Test

on:
  push:
    branches:
      - main
      - v1

  pull_request:
    branches:
      - main
      - v1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Use Node.js v24
        uses: actions/setup-node@v5
        with:
          node-version: v24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check Cloudflare app generated types
        run: pnpm --filter @unlighthouse/app-cloudflare run types:check

      - name: Typecheck Cloudflare app
        run: pnpm --filter @unlighthouse/app-cloudflare run typecheck

      - name: Test Cloudflare app in workerd
        run: pnpm --filter @unlighthouse/app-cloudflare run test

      - name: Dry-run Cloudflare Worker bundle
        run: pnpm --filter @unlighthouse/app-cloudflare run deploy:dry-run

      - name: Test
        run: pnpm run test

      - name: Test attw
        run: pnpm run test:attw

      - name: Test publint
        run: pnpm run test:publint
