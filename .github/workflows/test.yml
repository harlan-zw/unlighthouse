name: Test

on:
  push:
    branches:
      - main
      - v1
    paths-ignore:
      - '**/*.md'

  pull_request:
    paths-ignore:
      - '**/*.md'

jobs:
  runtime-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test audit download and cache recovery
        run: pnpm exec vitest run packages/unlighthouse/test/audit-artifact.test.ts packages/unlighthouse/test/audit-download-config.test.ts packages/unlighthouse/test/compact-runtime.test.ts packages/unlighthouse/test/runtime-download.test.ts
      - name: Build audit packages
        run: pnpm --filter @unlighthouse/contracts --filter @unlighthouse/core --filter @unlighthouse/mcp --filter @unlighthouse/lighthouse-runtime --filter unlighthouse run build
      - name: Pack audit runtime
        run: pnpm --filter @unlighthouse/lighthouse-runtime pack --out "${{ runner.temp }}/audit-runtime.tgz"
      - name: Audit with downloaded Chrome
        env:
          SMOKE_OUTPUT: ${{ runner.temp }}/unlighthouse-smoke
        run: node packages/unlighthouse/scripts/smoke-runtime.ts cold "${{ runner.temp }}/audit-runtime.tgz"
      - name: Audit with offline runtime reuse
        env:
          SMOKE_OUTPUT: ${{ runner.temp }}/unlighthouse-smoke
        run: node packages/unlighthouse/scripts/smoke-runtime.ts offline
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-audit-smoke
          path: ${{ runner.temp }}/unlighthouse-smoke/smoke-*.json
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Use Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: v24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check Cloudflare app generated types
        run: pnpm --filter @unlighthouse/app-cloudflare run types:check

      - name: Typecheck Cloudflare app
        run: pnpm --filter @unlighthouse/app-cloudflare run typecheck

      - name: Test Cloudflare app in workerd
        run: pnpm --filter @unlighthouse/app-cloudflare run test

      - name: Dry-run Cloudflare Worker bundle
        run: pnpm --filter @unlighthouse/app-cloudflare run deploy:dry-run

      - name: Test
        run: pnpm run test

      - name: Test attw
        run: pnpm run test:attw

      - name: Test publint
        run: pnpm run test:publint
