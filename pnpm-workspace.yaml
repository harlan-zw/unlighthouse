    '@iconify-json/mdi': latest
    '@iconify-json/simple-line-icons': latest
    '@lhci/utils': ^0.16.1
    '@nuxt/ui': ^4.13.0
    '@puppeteer/browsers': ^3.2.7
    '@tailwindcss/vite': ^4.3.5
    '@vueuse/core': ^15.0.0
    '@vueuse/router': ^15.0.0
    c12: ^3.3.4
