    '@iconify-json/mdi': latest
    '@iconify-json/simple-line-icons': latest
    '@lhci/utils': ^0.15.1
    '@nuxt/ui': ^4.11.1
    '@puppeteer/browsers': ^3.2.2
    '@tailwindcss/vite': ^4.3.3
    '@vueuse/core': ^15.0.0
    '@vueuse/router': ^15.0.0
    c12: ^3.3.4
    cac: ^7.0.0
    chrome-launcher: ^1.2.1
    consola: ^3.4.2
    defu: ^6.1.7
