catalogMode: prefer

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar@4.0.3
  - semver@5.7.2
  - semver@6.3.1
packages:
  - packages/*
  - crux-api
  - '!docs'

overrides:
  rollup: 4.59.0
catalog:
  '@antfu/eslint-config': ^9.1.0
  '@arethetypeswrong/cli': 0.18.4
  '@types/lodash-es': ^4.17.12
  '@types/three': ^0.185.0
  '@types/ws': ^8.18.1
  '@vitejs/plugin-vue': ^6.0.7
  '@vue/compiler-sfc': ^3.5.39
  bumpp: ^11.1.0
  eslint: ^10.6.0
  obuild: ^0.4.37
  puppeteer: ^25.2.1
  typescript: ^6.0.3
  vitest: ^4.1.9

catalogs:
  crux-api:
    nitropack: latest
  dependencies:
    '@clack/prompts': ^1.6.0
    '@iconify-json/carbon': latest
    '@iconify-json/icomoon-free': latest
    '@iconify-json/la': latest
    '@iconify-json/logos': latest
    '@iconify-json/mdi': latest
    '@iconify-json/simple-line-icons': latest
    '@lhci/utils': ^0.15.1
    '@nuxt/ui': ^4.9.0
    '@puppeteer/browsers': ^3.0.5
    '@tailwindcss/vite': ^4.3.1
    '@vueuse/core': ^14.3.0
    '@vueuse/router': ^14.3.0
    c12: ^3.3.4
    cac: ^7.0.0
    chrome-launcher: ^1.2.1
    consola: ^3.4.2
    defu: ^6.1.7
    fuse.js: ^7.4.2
    h3: ^1.15.11
    hookable: ^6.1.1
    launch-editor: ^2.14.1
    lighthouse: ^13.4.0
    lightweight-charts: ^5.2.0
    listhen: ^1.10.0
    lodash-es: ^4.18.1
    ofetch: ^1.5.1
    pathe: ^2.0.3
    puppeteer-cluster: ^0.25.0
    puppeteer-core: ^25.2.1
    radix3: ^1.1.2
    regexparam: ^3.0.0
    sanitize-filename: ^1.6.4
    sitemapper: ^4.1.6
    slugify: ^1.6.9
    std-env: ^4.1.0
    tailwindcss: ^4.3.1
    three: ^0.185.0
    tinyexec: ^1.2.4
    ufo: ^1.6.4
    ultrahtml: ^1.6.0
    unctx: ^2.5.0
    unplugin-auto-import: ^21.0.0
    unplugin-icons: ^23.0.1
    unplugin-vue-components: ^32.1.0
    vite: ^8.1.0
    vite-plugin-pages: ^0.33.3
    vue: ^3.5.39
    ws: ^8.21.0

ignoredBuiltDependencies:
  - vue-demi

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - puppeteer

packageExtensions:
  puppeteer-cluster:
    peerDependencies:
      puppeteer-core: '*'
    peerDependenciesMeta:
      puppeteer:
        optional: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  puppeteer: true
  vue-demi: true
