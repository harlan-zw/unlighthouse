catalogMode: prefer

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260717.1'
  - nuxt-use-query@1.0.0
  - '@mdream/js@1.5.13'
  - wrangler@4.147.0

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 262800

trustPolicyExclude:
  - chokidar@4.0.3
  - semver@5.7.2
  - semver@6.3.1

peerDependencyRules:
  ignoreMissing:
    - '@pinia/colada'
    - pinia

shellEmulator: true

packages:
  - packages/*
  - apps/*
  - '!docs'

overrides:
  '@nuxt/kit': 4.6.4
  nuxt: 4.6.4
  vite: 8.3.8

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  maplibre-gl: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

ignoredBuiltDependencies:
  - vue-demi

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - better-sqlite3
  - esbuild

