catalogMode: prefer

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - vite@8.3.5

trustPolicy: no-downgrade
trustPolicyExclude:
  # Published by chrome-devtools-npm and pinned by Puppeteer.
  - chromium-bidi@157.0.8090-0
  - chokidar@4.0.3
  - semver@5.7.2
  - semver@6.3.1

shellEmulator: true

packages:
  - packages/*
  - crux-api
  - '!docs'

overrides:
  rollup: 4.64.12

packageExtensions:
  puppeteer-cluster:
    peerDependencies:
      puppeteer-core: '*'
    peerDependenciesMeta:
      puppeteer:
        optional: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  puppeteer: true
  vue-demi: true

ignoredBuiltDependencies:
  - vue-demi

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - puppeteer

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@arethetypeswrong/cli': 0.18.5
  '@types/lodash-es': ^4.17.12
  '@types/three': ^0.187.0
  '@types/ws': ^8.18.2
  '@typescript/native': npm:typescript@7.1.0-beta
  '@vitejs/plugin-vue': ^6.0.11
  '@vue/compiler-sfc': ^3.5.45
  bumpp: ^12.3.0
  eslint: ^10.15.0
  obuild: ^0.4.45
  puppeteer: 25.18.1
  typescript: npm:@typescript/typescript6@^6.0.2
  vitest: ^5.1.1

catalogs:
  crux-api:
    nitropack: latest
  dependencies:
    '@clack/prompts': ^1.9.0
    '@iconify-json/carbon': latest
    '@iconify-json/icomoon-free': latest
    '@iconify-json/la': latest
