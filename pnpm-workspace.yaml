catalogMode: prefer
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@5.7.2
  - semver@6.3.1

shellEmulator: true

packages:
  - packages/*
  - crux-api
  - '!docs'

overrides:
  rollup: 4.63.4

packageExtensions:
  puppeteer-cluster:
    peerDependencies:
      puppeteer-core: '*'
    peerDependenciesMeta:
      puppeteer:
        optional: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  puppeteer: true
  vue-demi: true

ignoredBuiltDependencies:
  - vue-demi

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - puppeteer

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@arethetypeswrong/cli': 0.18.5
  '@types/lodash-es': ^4.17.12
  '@types/three': ^0.186.0
  '@types/ws': ^8.18.1
  '@vitejs/plugin-vue': ^6.0.9
  '@vue/compiler-sfc': ^3.5.43
  bumpp: ^12.3.0
  eslint: ^10.11.0
  obuild: ^0.4.40
  puppeteer: ^25.11.0
  typescript: ^6.0.3
  vitest: ^5.0.1

catalogs:
  crux-api:
    nitropack: latest
  dependencies:
    '@clack/prompts': ^1.8.1
    '@iconify-json/carbon': latest
    '@iconify-json/icomoon-free': latest
    '@iconify-json/la': latest
