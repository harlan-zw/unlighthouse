# Unlighthouse CF preset — Phase 5.5 deploy config with real Lighthouse via
# Cloudflare Containers + Browser Run external CDP.
#
# One-time setup:
#   pnpm wrangler d1 create unlighthouse           # → copy database_id below
#   pnpm wrangler r2 bucket create unlighthouse    # → no id needed
#   pnpm wrangler secret put SHARED_AUDIT_TOKEN    # random 32 bytes
#   pnpm wrangler secret put CF_BROWSER_RUN_TOKEN  # Cloudflare API token,
#                                                  # scope: Browser Rendering - Edit
#   pnpm wrangler secret put CF_ACCOUNT_ID         # for Browser Run WS URL
#   pnpm wrangler secret put CRUX_API_KEY          # optional; CrUX fallback
#
# Deploy:
#   pnpm wrangler deploy   # builds + pushes the Container image, then the Worker
#
# Verification curls + risks: see ./README.md.

name = "unlighthouse"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = [ "nodejs_compat" ]

# ── Dashboard SPA ─────────────────────────────────────────────────────────────
# The built Nuxt UI (packages/ui/.output/public). The Worker serves it for all
# non-API GET routes (see app.ts), so one Worker hosts both the panel and the
# API. Build it first with: NUXT_PUBLIC_UNLIGHTHOUSE_API_URL=/api pnpm --filter @unlighthouse/ui build
[assets]
binding = "ASSETS"
directory = "../../../ui/.output/public"
not_found_handling = "single-page-application"

# ── Bindings ────────────────────────────────────────────────────────────────

[[d1_databases]]
binding = "DB"
database_name = "unlighthouse"
database_id = "3554d93a-6bd5-4578-af41-2593e2aea3b2"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "unlighthouse"

[[durable_objects.bindings]]
name = "SCAN_EVENTS_DO"
class_name = "ScanEventsDO"

[[durable_objects.bindings]]
name = "RATE_LIMITER_DO"
class_name = "RateLimiterDO"

# NOTE: the LIGHTHOUSE_CONTAINER binding + [[containers]] block were removed to
# stop Browser Run / container compute cost. Real Lighthouse is gone; scans fall
# back to crux→mock. To restore: re-add the binding + container block below, the
# `LighthouseContainer` import/export in worker.ts, and a `new_sqlite_classes`
# migration — and deploy with Docker (image build). The Browser-Run-session
# cost fix (close() + keep_alive 60s, commit 26e46f92d) is already in the code.

# Alarm-driven durable scan scheduler. Owns the per-scan URL queue and drives
# one audit per alarm tick (delegated back to the Worker via the SELF service
# binding), so multi-URL scans survive past the waitUntil budget.
[[durable_objects.bindings]]
name = "SCAN_RUNNER_DO"
class_name = "ScanRunnerDO"

# ── Service binding to self ─────────────────────────────────────────────────
# ScanRunnerDO calls back into this same Worker (POST /__scan/audit) to run each
# per-URL audit with the consumer's auditor, one fresh invocation per URL.
[[services]]
binding = "SELF"
service = "unlighthouse"

# ── Container (real Lighthouse host) — REMOVED to stop cost ─────────────────
# The [[containers]] block + LighthouseContainer DO were removed; see the note
# by the durable_objects bindings above for how to restore. Without it, wrangler
# deploy needs no Docker image build.

# ── DO migrations ──────────────────────────────────────────────────────────

[[migrations]]
tag = "v1"
new_sqlite_classes = [
  "ScanEventsDO",
  "RateLimiterDO"
]

# v2 adds the LighthouseContainer DO. Container DOs ride on top of a
# sqlite-backed DO under the hood, so they go in `new_sqlite_classes`.
[[migrations]]
tag = "v2"
new_sqlite_classes = [ "LighthouseContainer" ]

# v3 adds the alarm-driven ScanRunnerDO. setAlarm requires the SQLite storage
# backend, so it must be registered via new_sqlite_classes.
[[migrations]]
tag = "v3"
new_sqlite_classes = [ "ScanRunnerDO" ]

# v4 removes the LighthouseContainer DO/container to stop Browser Run + container
# compute cost. (binding + [[containers]] block also removed above.)
[[migrations]]
tag = "v4"
deleted_classes = [ "LighthouseContainer" ]

# ── Vars ────────────────────────────────────────────────────────────────────

[vars]
# Inline unlighthouse config (JSON). Same shape as the CLI's
# `unlighthouse.config.ts` — at minimum `site` is required, the rest
# defaults from `defaultConfig`.
UNLIGHTHOUSE_CONFIG = '{"site": "https://example.com"}'

# Surfaced by manifest + health responses. Bump on each deploy.
UNLIGHTHOUSE_VERSION = "1.0.0-rc.2"

# Token-bucket rate limiter (per API key / IP). Defaults: 10 / 1 per sec.
RATE_LIMITER_CAPACITY = "10"
RATE_LIMITER_REFILL_PER_SEC = "1"

# Mock auditor mode — flip to "1" to bypass the Container and exercise the
# rest of the wiring (D1, R2, DOs, HTTP, WS) with a synthetic LHR. Useful
# during smoke tests; off in production.
# UNLIGHTHOUSE_USE_MOCK_AUDITOR = "1"

# ── Cron triggers ──────────────────────────────────────────────────────────

# R2 TTL sweeper — walks the bucket hourly and removes any blob whose
# customMetadata.expiresAt has passed. Adjust the cron expression to your
# write-volume; once a day is fine for most setups.
[triggers]
crons = [ "0 * * * *" ]
